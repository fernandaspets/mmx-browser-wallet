<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMX Swap Pools</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
  :root {
    --bg: #0d0f1a; --bg-card: rgba(255,255,255,0.03); --bg-input: rgba(0,0,0,0.3);
    --border: rgba(255,255,255,0.08); --text: #e4e6ef; --text-muted: #8b8fa3;
    --accent: #6c8aff; --accent-bg: rgba(108,138,255,0.1);
    --success: #4caf50; --warning: #ffa726; --danger: #ef5350;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 24px; }
  .app { width: 100%; max-width: 600px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h1 { font-size: 20px; font-weight: 700; color: var(--accent); }
  .badge { font-size: 11px; padding: 4px 10px; background: var(--accent-bg); border: 1px solid rgba(108,138,255,0.2); border-radius: 20px; color: var(--accent); }
  .badge.connected { color: var(--success); border-color: rgba(76,175,80,0.2); background: rgba(76,175,80,0.08); }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; }
  .pool-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .pool-name { font-size: 16px; font-weight: 700; color: var(--accent); }
  .pool-addr { font-family: monospace; font-size: 10px; color: var(--text-muted); cursor: pointer; }
  .pool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pool-stat { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .pool-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .pool-stat-value { font-size: 15px; font-weight: 600; }
  .pool-stat-value small { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .fee-row { display: flex; gap: 4px; margin-top: 8px; }
  .fee-pill { font-size: 10px; padding: 2px 8px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; color: var(--text-muted); }
  .status { font-size: 13px; color: var(--text-muted); min-height: 20px; text-align: center; }
  .refresh-btn { width: 100%; padding: 10px; border: none; border-radius: var(--radius); background: var(--accent); color: white; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .refresh-btn:hover { opacity: 0.9; }
  .trade-box { margin-top: 12px; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; }
  .trade-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .trade-input { flex: 1; padding: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; }
  .trade-label { font-size: 11px; color: var(--text-muted); min-width: 60px; }
  .trade-result { font-size: 13px; color: var(--success); padding: 8px; background: rgba(76,175,80,0.06); border-radius: 6px; }
  .trade-btn { padding: 6px 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .trade-btn:hover { opacity: 0.9; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>MMX Swap Pools</h1>
    <div class="badge" id="statusBadge">loading...</div>
  </div>
  <div class="status" id="statusMsg">Fetching pools...</div>
  <div id="poolsList"></div>
  <button class="refresh-btn" onclick="loadPools()">🔄 Refresh</button>
  <div style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:16px;">
    Powered by MMX public RPC · No server required ·
    <a href="https://github.com/fernandaspets/mmx-browser-wallet" target="_blank">MMX Wallet</a>
  </div>
</div>

<script>
const RPC = "https://rpc.mmx.network";

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

async function loadPools() {
  const status = document.getElementById("statusMsg");
  const badge = document.getElementById("statusBadge");
  const list = document.getElementById("poolsList");
  status.textContent = "Fetching pools...";
  badge.textContent = "loading";
  badge.className = "badge";

  try {
    const resp = await fetch(`${RPC}/swap/list?limit=50`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const pools = await resp.json();

    if (pools.length === 0) {
      list.innerHTML = '<div class="card" style="text-align:center;color:var(--text-muted);">No swap pools found.</div>';
      status.textContent = "";
      badge.textContent = "no pools";
      return;
    }

    badge.textContent = `${pools.length} pools`;
    badge.className = "badge connected";
    status.textContent = "";

    let html = "";
    for (const pool of pools) {
      const [bal0, bal1] = pool.balance || [{}, {}];
      const [sym0, sym1] = pool.symbols || ["?", "?"];
      const [dec0, dec1] = pool.decimals || [0, 6];
      const price = bal0.value > 0 ? (bal1.value / bal0.value) : 0;
      const [apy0, apy1] = pool.avg_apy_7d || [0, 0];
      const apy0val = (apy0 != null ? apy0 : 0);
      const apy1val = (apy1 != null ? apy1 : 0);
      const feesClaimed = pool.fees_claimed || [];
      const feeRates = pool.fee_rates || [];

      html += `<div class="card" id="pool-${escapeHtml(pool.address)}">
        <div class="pool-header">
          <div>
            <div class="pool-name">${escapeHtml(pool.name || sym0 + "|" + sym1)}</div>
            <div class="pool-addr" onclick="navigator.clipboard.writeText('${escapeHtml(pool.address)}')">${escapeHtml(pool.address.substring(0,30))}...</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:11px;color:var(--text-muted);">Price</div>
            <div style="font-size:15px;font-weight:600;color:var(--accent);">${price.toFixed(2)} <small>${sym1}/${sym0}</small></div>
          </div>
        </div>
        <div class="pool-grid">
          <div class="pool-stat">
            <div class="pool-stat-label">${escapeHtml(sym0)} Reserve</div>
            <div class="pool-stat-value">${escapeHtml(bal0.value?.toString() || "0")} <small>${escapeHtml(sym0)}</small></div>
          </div>
          <div class="pool-stat">
            <div class="pool-stat-label">${escapeHtml(sym1)} Reserve</div>
            <div class="pool-stat-value">${escapeHtml(bal1.value?.toString() || "0")} <small>${escapeHtml(sym1)}</small></div>
          </div>
          <div class="pool-stat">
            <div class="pool-stat-label">7d APY</div>
            <div class="pool-stat-value">${apy0val.toFixed(2)}% <small>/ ${apy1val.toFixed(4)}%</small></div>
          </div>
          <div class="pool-stat">
            <div class="pool-stat-label">Fees Claimed</div>
            <div class="pool-stat-value">${escapeHtml(feesClaimed[0]?.value?.toString() || "0")} <small>${escapeHtml(sym0)}</small></div>
          </div>
        </div>
        <div class="fee-row">
          ${feeRates.map(f => `<div class="fee-pill">${(f * 100).toFixed(2)}%</div>`).join("")}
        </div>
        <div class="trade-box">
          <div class="trade-row">
            <span class="trade-label">Sell</span>
            <input type="number" class="trade-input" id="tradeAmt-${escapeHtml(pool.address)}" placeholder="1" value="1" min="0" step="0.001">
            <select class="trade-input" id="tradeDir-${escapeHtml(pool.address)}" style="flex:0;min-width:80px;">
              <option value="0">${escapeHtml(sym0)} → ${escapeHtml(sym1)}</option>
              <option value="1">${escapeHtml(sym1)} → ${escapeHtml(sym0)}</option>
            </select>
            <button class="trade-btn" onclick="estimateTrade('${escapeHtml(pool.address)}')">Estimate</button>
          </div>
          <div id="tradeResult-${escapeHtml(pool.address)}" style="display:none;"></div>
        </div>
      </div>`;
    }
    list.innerHTML = html;
  } catch (e) {
    status.textContent = "Error: " + e.message;
    badge.textContent = "error";
    badge.style.color = "var(--danger)";
  }
}

async function estimateTrade(poolAddr) {
  const amt = document.getElementById(`tradeAmt-${poolAddr}`).value;
  const dir = document.getElementById(`tradeDir-${poolAddr}`).value;
  const result = document.getElementById(`tradeResult-${poolAddr}`);
  result.style.display = "block";
  result.className = "trade-result";
  result.textContent = "Estimating...";

  // Convert human amount to raw units based on the selling token's decimals
  // Actually the API accepts HUMAN amounts directly (like the official GUI)
  const rawAmt = amt;

  try {
    const resp = await fetch(`${RPC}/swap/trade_estimate?id=${poolAddr}&index=${dir}&amount=${rawAmt}&iters=1`);
    if (!resp.ok) {
      const errText = await resp.text();
      if (errText.includes("out of gas") || errText.includes("amount_left")) {
        throw new Error("Pool too illiquid for this trade. Try a smaller amount.");
      }
      throw new Error(`HTTP ${resp.status}: ${errText.substring(0, 80)}`);
    }
    const est = await resp.json();
    const tradeVal = est.trade?.value || "0";
    const feeVal = est.fee?.value || "0";
    const feePct = est.fee_percent || 0;
    const avgPrice = est.avg_price || 0;
    // For buy (index=1): avg_price is TRAIL/MMX, GUI shows 1/avg_price = MMX/TRAIL
    // For sell (index=0): avg_price is MMX/TRAIL directly
    const displayPrice = dir === "1" ? (1 / avgPrice) : avgPrice;
    const priceLabel = dir === "1" ? "MMX/TRAIL" : "MMX/TRAIL";
    result.innerHTML = `You get: <strong>${escapeHtml(tradeVal)}</strong><br>Fee: ${escapeHtml(feeVal)} (${feePct.toFixed(2)}%) · Avg price: ${displayPrice.toFixed(3)} ${priceLabel}`;
  } catch (e) {
    result.className = "";
    result.style.color = "var(--danger)";
    result.textContent = "Error: " + e.message;
  }
}

loadPools();
</script>
</body>
</html>
